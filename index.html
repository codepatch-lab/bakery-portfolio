<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>こむぎ日和</title>
    <link rel="stylesheet" href="style.css">
</head>

<body id="top">

    <header>
        <div class="logo">こむぎ日和</div>

        <nav>
            <a href="#menu">パン</a>
            <a href="#about">お店について</a>
            <a href="#access">アクセス</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>毎日の食卓に、小さな焼きたてを。</h1>
            <p>国産小麦を使った、町の小さなパン屋です。</p>
        </section>

        <section id="menu" class="menu">
            <h2>こむぎ日和のパン</h2>

            <div class="bread-slider">

                <button type="button" class="slider-prev" aria-label="前のパンを見る">❮</button>

                <div class="bread-list">
                </div>

                <button type="button" class="slider-next" aria-label="次のパンを見る">❯</button>
            </div>
        </section>

        <section id="shopping-list">
            <h2>買いたいパンリスト</h2>
            <p>お店に行く前に、気になるパンを選んでね。</p>

            <ul id="selected-breads"></ul>
            <p id="total-price">合計：0円</p>

            <button type="button" id="clear-list">
                リストを空にする
            </button>
        </section>

        <section id="about" class="about">
            <h2>お店について</h2>
            <p>
                こむぎ日和は、毎日の食卓に寄り添う小さなパン屋です。
                国産小麦を使い、毎朝ひとつひとつ丁寧に焼き上げています。
            </p>
        </section>

        <section id="access" class="access">
            <h2>アクセス</h2>

            <div class="access-info">
                <p>〒000-0000 福井県〇〇市〇〇町1-2-3</p>
                <p>営業時間：8:00〜18:00</p>
                <p>定休日：火曜日</p>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 こむぎ日和</p>
    </footer>
